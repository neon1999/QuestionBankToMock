<app-header />

<main class="app-main">
  @if (phase() === 'setup') {
    <app-setup (startMockRequested)="startMock($event)" />
  } @else if (phase() === 'exam') {
    <app-exam
      [questions]="examQuestions()"
      [durationMinutes]="durationMinutes()"
      (completed)="finishMock($event)"
    />
  } @else if (result(); as examResult) {
    <app-results [result]="examResult" (createAnother)="createAnotherMock()" />
  }
</main>
